<main>
        <section class="contato-cabecalho">
            <h1>Aventuras nas Corredeiras</h1>
            <p>Av. das Corredeiras, 1200 – Centro, Canela/RS, CEP 95680-000</p>
            <p>(54) 3282-1040 | (54) 99999-1040</p>
            <p>contato@aventurasnascorredeiras.com.br</p>
        </section>

        <section class="contato-grade">
            <div class="mapa-coluna">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3484.0!2d-50.81!3d-29.36!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjnCsDIxJzM2LjAiUyA1MMKwNDgnMzYuMCJX!5e0!3m2!1spt-BR!2sbr!4v1700000000000"
                    width="600"
                    height="350"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Localização da Aventuras nas Corredeiras no Google Maps">
                </iframe>
            </div>

            <div class="formulario-coluna">
                <form action="#" method="post">
                    <div class="linha-campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>
                    </div>

                    <div class="linha-campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                    </div>

                    <div class="linha-campo linha-radio">
                        <span class="rotulo-grupo">Propósito da Mensagem</span>
                        <div class="opcoes-radio">
                            <label for="proposito-consulta">
                                <input type="radio" id="proposito-consulta" name="proposito" value="consulta-geral" required>
                                Consulta Geral
                            </label>
                            <label for="proposito-reserva">
                                <input type="radio" id="proposito-reserva" name="proposito" value="pergunta-reserva">
                                Pergunta sobre Reserva
                            </label>
                            <label for="proposito-sugestao">
                                <input type="radio" id="proposito-sugestao" name="proposito" value="sugestao-site">
                                Sugestão de Site
                            </label>
                        </div>
                    </div>

                    <div class="linha-campo linha-mensagem">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Digite aqui" required></textarea>
                    </div>

                    <div class="linha-checkbox">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter" value="sim">
                            Quero receber a newsletter mensal
                        </label>
                    </div>

                    <button type="submit" class="btn-enviar">Enviar Mensagem de Contato</button>
                </form>
            </div>
        </section>

        <section class="equipe-secao">
            <h2>Estamos Aqui para Serví-lo</h2>
            <div class="equipe-lista">
                <figure>
                    <img src="imagens/cliente-feliz.jpg" alt="Lucas Almeida, Guia Chefe de Operações">
                    <figcaption>Lucas Almeida – Guia Chefe de Operações</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafting1.jpg" alt="Mariana Costa, Coordenadora de Reservas">
                    <figcaption>Mariana Costa – Coordenadora de Reservas</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafting2.jpg" alt="Rafael Souza, Especialista em Segurança Fluvial">
                    <figcaption>Rafael Souza – Especialista em Segurança Fluvial</figcaption>
                </figure>
            </div>
        </section>
    </main>
